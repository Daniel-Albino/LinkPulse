<svg width="280" height="64" viewBox="0 0 280 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LinkPulse">
  <title>LinkPulse</title>

  <!-- Icon tile -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="#4F46E5"/>

  <!-- Pulse line -->
  <path d="M 16 32 L 24 32 L 28.5 21 L 33.5 43 L 37.5 32 L 48 32"
        fill="none" stroke="#FFFFFF" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- End nodes (the "link") -->
  <circle cx="16" cy="32" r="5" fill="#FFFFFF"/>
  <circle cx="16" cy="32" r="2" fill="#4F46E5"/>
  <circle cx="48" cy="32" r="5" fill="#FFFFFF"/>
  <circle cx="48" cy="32" r="2" fill="#4F46E5"/>

  <!-- Wordmark -->
  <text x="80" y="41" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="27">
    <tspan fill="#FFFFFF" font-weight="500">Link</tspan><tspan fill="#4F46E5" font-weight="700">Pulse</tspan>
  </text>
</svg>
